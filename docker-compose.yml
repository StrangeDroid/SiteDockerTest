services:
  db:
    image: postgres:16-alpine
    container_name: flowers-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowers_db}
      POSTGRES_USER: ${POSTGRES_USER:-flowers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowers}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to reach the DB from the host (e.g. running the app via `dotnet run`)
    # ports:
    #   - "5432:5432"

  app:
    # Published by GitHub Actions from master; `docker compose pull` downloads it.
    # `docker compose up --build` builds it locally from the Dockerfile instead.
    image: ghcr.io/strangedroid/sitedockertest:${APP_TAG:-latest}
    container_name: flowers-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-flowers_db};Username=${POSTGRES_USER:-flowers};Password=${POSTGRES_PASSWORD:-flowers}"
    ports:
      - "5273:5273"
      - "7041:7041"

volumes:
  db-data:
